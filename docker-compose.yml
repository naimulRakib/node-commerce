version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: nodecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: web_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nodecommerce_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/web_db?schema=public"
      JWT_SECRET: "nodecommerce-dev-jwt-secret-change-in-prod"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
